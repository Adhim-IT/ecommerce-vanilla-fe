<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User</title>
    <link href="../assets/dist/output.css" rel="stylesheet">
    <script type="module" src="../assets/js/components/navbar.js"></script>
    <script type="module" src="../assets/js/admin/page-user.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</head>

<body class="bg-gray-100">
    <app-navbar></app-navbar>

    <section class="p-3 sm:p-5 antialiased">
        <div class="mx-auto max-w-screen-xl px-4 lg:px-12">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-gray-900">Manage Users</h1>
                <button type="button" id="createUserModalButton" onclick="window.openCreateModal()" class="flex items-center justify-center text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">
                    <svg class="h-3.5 w-3.5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path clip-rule="evenodd" fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" />
                    </svg>
                    Add User
                </button>
            </div>

            <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                            <tr>
                                <th scope="col" class="px-4 py-4">User Name</th>
                                <th scope="col" class="px-4 py-3">Email</th>
                                <th scope="col" class="px-4 py-3"><span class="sr-only">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <div id="createUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Add User</h2>
            <form id="createForm" onsubmit="window.handleSaveUser(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-900 dark:text-white mb-1">User Name</label>
                    <input type="text" name="name" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-900 dark:text-white mb-1">Email</label>
                    <input type="email" name="email" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 font-medium">Save</button>
                    <button type="button" onclick="window.closeCreateModal()" class="flex-1 bg-gray-300 text-gray-900 py-2 px-4 rounded hover:bg-gray-400 font-medium">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <div id="updateUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Edit User</h2>
            <form id="updateForm" onsubmit="window.handleSaveUser(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-900 dark:text-white mb-1">User Name</label>
                    <input type="text" name="name" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-900 dark:text-white mb-1">Email</label>
                    <input type="email" name="email" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 text-sm dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 font-medium">Update</button>
                    <button type="button" onclick="window.closeUpdateModal()" class="flex-1 bg-gray-300 text-gray-900 py-2 px-4 rounded hover:bg-gray-400 font-medium">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Delete User</h2>
            <p class="text-gray-600 dark:text-gray-300 mb-6">Are you sure you want to delete this user?</p>
            <div class="flex gap-3">
                <button type="button" onclick="window.confirmDelete()" class="flex-1 bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 font-medium">Delete</button>
                <button type="button" onclick="window.closeDeleteModal()" class="flex-1 bg-gray-300 text-gray-900 py-2 px-4 rounded hover:bg-gray-400 font-medium">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const isAuthenticated = localStorage.getItem('token') !== null;
        if (!isAuthenticated) {
            window.location.href = '../login.html';
        }
    </script>
</body>

</html>
