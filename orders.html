<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Saya</title>
    <link href="./assets/dist/output.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <script type="module" src="./assets/js/components/navbar.js"></script>
    <script type="module" src="./assets/js/orders.js"></script>
    <script type="module" src="./assets/js/auth.js"></script>
</head>
<body class="bg-gray-100">
    <app-navbar></app-navbar>
    <div class="p-6">
        <h1 class="text-2xl font-bold mb-6">Pesanan Saya</h1>
        <div id="orders-container">
            <p class="text-gray-500">Loading...</p>
        </div>
    </div>

    <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h2 class="text-xl font-bold mb-4">Pembayaran</h2>
            <div id="card-element" class="border rounded p-3 mb-4"></div>
            <div id="card-errors" class="text-red-600 mb-4"></div>
            <button id="pay-button" class="bg-blue-600 text-white px-4 py-2 rounded w-full mb-2">Bayar Sekarang</button>
            <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="bg-gray-400 text-white px-4 py-2 rounded w-full">Batal</button>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) window.location.href = 'login.html';
    </script>
</body>
</html>
