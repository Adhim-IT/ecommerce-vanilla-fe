<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Adhim</title>
    <link href="./assets/dist/output.css" rel="stylesheet">
    <script type="module" src="./assets/js/components/navbar.js"></script>
    <script type="module" src="./assets/js/product.js"></script>
    <script type="module" src="./assets/js/cart.js"></script>
    <script type="module" src="./assets/js/auth.js"></script>
</head>

<body class="bg-gray-200">
    <app-navbar></app-navbar>
    <div class="p-8">

        <input type="text" id="search-input" placeholder="Cari produk..." class="w-full border border-gray-300 rounded px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500" />
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

<script>
    const isAuthenticated = localStorage.getItem('token') !== null;

    if (!isAuthenticated) {
        window.location.href = 'login.html';
